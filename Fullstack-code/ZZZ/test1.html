<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test1</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            color: white;
            background-color: black;
        }

        

        main {
            display: flex;
            width: 100%;
            min-height: 91vh;

        }

        #top-left {
            width: 250px;
            background-color: antiquewhite;
            border-right: 1px solid rgb(224, 149, 149);
            padding: 10px;
            font-size: 12px;
            a{
                display: grid;
                justify-content: start;
                text-decoration: none;
                margin-bottom: 5px;
                color: black;
            }
        }

        #top-left div {
            font-weight: bold;
            margin-bottom: 8px;
            
        }

        .con {
            flex: 1;
            padding: 25px;
            background-color: #b8eaea;
        }

        #mid {
            display: flex;
            justify-content: space-between;
            background-color: rgb(115, 211, 211);
            padding: 5px;
            margin-bottom: 15px;
        }

        .box {
            width: 45%;
            display: grid;
            justify-content: center;
            align-items: center;

            h1 {
                display: flex;
                font-size: 45px;
                margin-bottom: 10px;
                justify-content: center;

            }

            p {
                font-size: 15px;
            }

            /*button{
            color: white;
            background-color: rgb(133, 133, 222);
            cursor: pointer;
            border: 1px solid black;
            border-radius: 5px;
            margin-bottom: 10px;
            padding: 8px;
            margin: 10px;
        }*/
            a {
                display: grid;
                justify-content: center;
                color: rgb(255, 255, 255);
                border: 1px solid rgb(14, 7, 21);
                background-color: blue;
                border-radius: 5px;
                padding: 8px;
                text-decoration: none
            }
        }

        .left-box {
            padding: 10px;
            width: 45%;
            background-color: rgb(216, 186, 245);
            border: 1px solid rgb(201, 226, 238);
            overflow-x: auto;

            h3 {
                padding: 15px;
            }

            img {
                max-width: 100%;
                height: auto;
            }

            /*button{
            color: white;
            background-color: rgb(133, 133, 222);
            cursor: pointer;
            border: 1px solid black;
            border-radius: 5px;
            padding: 8px;
            margin-top: 10px;
        }*/
            a {
                display: grid;
                justify-content: center;
                border: 1px solid black;
                text-decoration: none;
                background-color: blue;
                color: white;
                border-radius: 5px;
            }
        }

        #under {
            margin-top: 150px;
            display: flex;
            justify-content: space-between;
            background-color: rgb(115, 211, 211);
            padding: 5px;
            margin-bottom: 15px;
        }

        footer {
            color: white;
            background-color: black;
            padding: 6.5px;
            text-align: center;

        }
    </style>
</head>

<body>
    <header>
        <span>Aniwat.com</span>
        <span>Aniwat</span>
    </header>
    <main>
        <section id="top-left">
            <div>
                <a href="test1.html">HTML และ CSS</a>
                <a href="test1.html">เรียน HTML</a>
                <a href="test1.html">เรียน CSS</a>
            </div>

        </section>
        <div class="con">
            <section id="mid">
                <div class="box">
                    <h1>HTML</h1>
                    <p>ภาษาสำหรับสร้างหน้าเว็บ</p>
                    <!--<button>เรียน HTML</button>-->

                    <a href="test1.html">เรียน HTML</a>
                </div>
                <div class="left-box">
                    <h3>ตัวอย่าง HTML:</h3>
                    <img src="photo/kuy.png" />
                    <!--<button>ลองเขียนโค้ด ></button>-->
                    <a href="test1.html">ลองเขียนโค้ด ></a>
                </div>
            </section>
            <section id="under">
                <div class="box">
                    <h1>CSS</h1>
                    <p>ภาษาสำหรับสร้างหน้าเว็บ</p>
                    <!--<button>เรียน CSS</button>-->

                    <a href="test1.html">เรียน CSS</a>
                </div>
                <div class="left-box">
                    <h3>ตัวอย่าง CSS:</h3>
                    <img src="photo/kuy2.png" />
                    <!--<button>ลองเขียนโค้ด ></button>-->
                    <a href="test1.html">ลองเขียนโค้ด ></a>
                </div>
            </section>

        </div>
    </main>

    <footer>Copyright © Aniwat.com 2025</footer>
</body>

</html>
