<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>สินค้า</th>
                <th>จำนวน</th>
                <th>ราคา</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>ถังหูลู่</th>
                <td>1</td>
                <td>25</td>
            </tr>
            <tr>
                <th>ไก่ย่าง</th>
                <td>2</td>
                <td rowspan="2">60</td>
            </tr>
            <tr>
                <th>นมแพ็ค</th>
                <td>1</td>
                
            </tr>
            <tr>
                <th>ชาดำ</th>
                <td>1</td>
                <td>30</td>
            </tr>
            <tr>
                <th>ลาบหมู</th>
                <td>1</td>
                <td>50</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">ราคารวม</th>
                <td>225</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
